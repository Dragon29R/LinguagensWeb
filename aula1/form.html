<!DOCTYPE html>
<html>
  <head>
    <title>User Information Form</title>
  </head>
  <body>
    <h1>User Information Form</h1>
    <form method="POST" action="submit-form.php">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required><br>
      <label for="age">Age:</label>
      <input type="radio" id="age1" name="age" value="<18">
      <label for="age1"><18</label>
      <input type="radio" id="age2" name="age" value="19-35">
      <label for="age2">19-35</label>
      <input type="radio" id="age3" name="age" value="36-48">
      <label for="age3">36-48</label>
      <input type="radio" id="age4" name="age" value=">49">
      <label for="age4">>49</label><br>
      <label for="profession">Profession:</label>
      <input type="text" id="profession" name="profession" list="professions"><br>
      <datalist id="professions">
        <option value="Doctor">
        <option value="Teacher">
        <option value="Engineer">
        <option value="Writer">
      </datalist>
      <label for="country">Country:</label>
      <select id="country" name="country" required>
        <option value="" disabled selected>Select your country</option>
        <option value="USA">USA</option>
        <option value="Canada">Canada</option>
        <option value="UK">UK</option>
        <option value="Australia">Australia</option>
      </select><br>
      <label for="interests">Interests:</label><br>
      <input type="checkbox" id="interest1" name="interests[]" value="Music">
      <label for="interest1">Music</label>
      <input type="checkbox" id="interest2" name="interests[]" value="Sports">
      <label for="interest2">Sports</label>
      <input type="checkbox" id="interest3" name="interests[]" value="Movies">
      <label for="interest3">Movies</label><br>
      <label for="find-out">How did you find out about the site?</label><br>
      <textarea id="find-out" name="find-out"></textarea><br>
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
